<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">30-day estimate follow-up workflow</title>
  <desc id="d">After an estimate is delivered, the lead is tagged and followed up over 30 days in four phases: confirm and educate, follow up and nudge, handle objections, and stay top of mind. At the end an AI summary is saved to the contact and the lead moves to nurture.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ph-days { font-size: 15px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .ph-name { font-size: 12.5px; font-weight: 600; fill: #DBEAFE; text-anchor: middle; }
    .item { font-size: 12.5px; fill: #1E293B; }
    .dot { fill: #2563EB; }
  </style>

  <rect x="0.75" y="0.75" width="798.5" height="398.5" rx="16" fill="#F8FAFF" stroke="#DBEAFE" stroke-width="1.5"/>

  <!-- trigger -->
  <rect x="20" y="16" width="760" height="56" rx="12" fill="#2563EB"/>
  <text x="400" y="39" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Estimate delivered</text>
  <text x="400" y="59" text-anchor="middle" font-size="13" fill="#DBEAFE">Cleared from other workflows  ·  tagged "Estimate Sent"  ·  first call task 3 minutes later</text>

  <line x1="400" y1="72" x2="400" y2="92" stroke="#2563EB" stroke-width="2"/>
  <path d="M394 88 L400 98 L406 88 Z" fill="#2563EB"/>

  <!-- phase 1 -->
  <rect x="20" y="104" width="178" height="226" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <path d="M20 116 a12 12 0 0 1 12 -12 h154 a12 12 0 0 1 12 12 v34 h-178 z" fill="#2563EB"/>
  <text class="ph-days" x="109" y="127">Days 1-3</text>
  <text class="ph-name" x="109" y="144">Confirm and educate</text>
  <circle class="dot" cx="38" cy="176" r="3"/><text class="item" x="50" y="180">Call task after 3 min</text>
  <circle class="dot" cx="38" cy="204" r="3"/><text class="item" x="50" y="208">Text: confirm receipt</text>
  <circle class="dot" cx="38" cy="232" r="3"/><text class="item" x="50" y="236">Email: what to consider</text>
  <circle class="dot" cx="38" cy="260" r="3"/><text class="item" x="50" y="264">Email: decision path</text>

  <!-- phase 2 -->
  <rect x="214" y="104" width="178" height="226" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <path d="M214 116 a12 12 0 0 1 12 -12 h154 a12 12 0 0 1 12 12 v34 h-178 z" fill="#1D4ED8"/>
  <text class="ph-days" x="303" y="127">Days 4-8</text>
  <text class="ph-name" x="303" y="144">Follow up and nudge</text>
  <circle class="dot" cx="232" cy="176" r="3"/><text class="item" x="244" y="180">Call task</text>
  <circle class="dot" cx="232" cy="204" r="3"/><text class="item" x="244" y="208">Soft urgency message</text>
  <circle class="dot" cx="232" cy="232" r="3"/><text class="item" x="244" y="236">AI summary logged</text>
  <circle class="dot" cx="232" cy="260" r="3"/><text class="item" x="244" y="264">"Before you decide"</text>
  <circle class="dot" cx="232" cy="288" r="3"/><text class="item" x="244" y="292">Qualifying question</text>

  <!-- phase 3 -->
  <rect x="408" y="104" width="178" height="226" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <path d="M408 116 a12 12 0 0 1 12 -12 h154 a12 12 0 0 1 12 12 v34 h-178 z" fill="#0EA5E9"/>
  <text class="ph-days" x="497" y="127">Days 11-20</text>
  <text class="ph-name" x="497" y="144" style="fill:#E0F2FE">Handle objections</text>
  <circle class="dot" cx="426" cy="176" r="3"/><text class="item" x="438" y="180">Call task</text>
  <circle class="dot" cx="426" cy="204" r="3"/><text class="item" x="438" y="208">Next steps + scope</text>
  <circle class="dot" cx="426" cy="232" r="3"/><text class="item" x="438" y="236">Timing, budget, scope</text>
  <circle class="dot" cx="426" cy="260" r="3"/><text class="item" x="438" y="264">Objection probe</text>
  <circle class="dot" cx="426" cy="288" r="3"/><text class="item" x="438" y="292">Call or video message</text>

  <!-- phase 4 -->
  <rect x="602" y="104" width="178" height="226" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <path d="M602 116 a12 12 0 0 1 12 -12 h154 a12 12 0 0 1 12 12 v34 h-178 z" fill="#10B981"/>
  <text class="ph-days" x="691" y="127">Days 24-30</text>
  <text class="ph-name" x="691" y="144" style="fill:#D1FAE5">Stay top of mind</text>
  <circle class="dot" cx="620" cy="176" r="3"/><text class="item" x="632" y="180">Project opening</text>
  <circle class="dot" cx="620" cy="204" r="3"/><text class="item" x="632" y="208">"Here when ready"</text>
  <circle class="dot" cx="620" cy="232" r="3"/><text class="item" x="632" y="236">Soft close + referral ask</text>

  <!-- handoff -->
  <line x1="400" y1="330" x2="400" y2="346" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M394 342 L400 352 L406 342 Z" fill="#F59E0B"/>
  <rect x="20" y="354" width="760" height="34" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="400" y="376" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400E">No response by Day 30? AI summary saved to the contact, then the lead moves to Lead Nurture</text>
</svg>
